<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>股票看板</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0e17;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #e5e7eb;
    min-height: 100vh;
  }
  .navbar {
    background: #111827;
    border-bottom: 1px solid #1f2937;
    padding: 0 24px;
    display: flex;
    align-items: center;
    height: 56px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .navbar .brand {
    font-size: 16px;
    font-weight: 700;
    color: #ff9f43;
    margin-right: 40px;
  }
  .navbar a {
    color: #9ca3af;
    text-decoration: none;
    padding: 8px 16px;
    border-radius: 6px;
    font-size: 14px;
    transition: all 0.2s;
  }
  .navbar a:hover { color: #fff; background: #1f2937; }
  .navbar a.active { color: #ff9f43; background: rgba(255,159,67,0.1); }

  .container {
    max-width: 100%;
    margin: 0 auto;
    padding: 10px 4px;
  }

  .chart-card {
    background: #111827;
    border-radius: 12px;
    padding: 10px 4px;
    border: 1px solid #1f2937;
  }
  .chart-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .chart-title {
    font-size: 18px;
    font-weight: 700;
    color: #fff;
  }
  .time-badge {
    background: #1f2937;
    padding: 4px 12px;
    border-radius: 6px;
    font-size: 13px;
    color: #9ca3af;
  }
  .time-badge span {
    font-weight: 600;
    color: #fff;
  }
  .chart-scroll {
    width: 100%;
    
    -webkit-overflow-scrolling: touch;
  }
  .chart-wrapper {
    position: relative;
    height: 80vh;
    width: 100%;
  }

  .loading {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: #4b5563;
    font-size: 14px;
  }
  .empty-state {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: #4b5563;
    font-size: 14px;
    text-align: center;
  }
</style>
</head>
<body>

<nav class="navbar">
  <div class="brand">📊 股票看板</div>
  <button class="hamburger" onclick="document.getElementById('navMenu').classList.toggle('show')">☰</button>
  <div class="nav-links" id="navMenu">
    <a href="/" class="active">资金流向</a>
    <a href="/market">行情总览/每日复盘</a>
    <a href="/rank">排行榜</a>
    <a href="/kline">个股K线</a>
    <a href="/screener">选股器</a>
        <a href="/shortterm">短线选股</a>
    <a href="/precious">贵金属</a>
    
  </div>
</nav>
<style>
.nav-links { display: none; position: absolute; top: 56px; left: 0; right: 0; background: #111827; flex-direction: column; padding: 8px 0; border-bottom: 1px solid #1f2937; }
.nav-links.show { display: flex; }
.nav-links a { padding: 12px 24px !important; }
.hamburger { margin-left: auto; background: none; border: none; color: #e5e7eb; font-size: 22px; cursor: pointer; padding: 8px 12px; }
@media(min-width:768px){
  .nav-links { display: flex !important; position: static; flex-direction: row; background: none; border: none; padding: 0; }
  .hamburger { display: none; }
}
</style>
<div class="container">
  <div class="chart-card">
    <div class="chart-header">
      <div style="text-align:center;width:100%;margin-bottom:6px;"><span id="fundTitle" style="font-size:18px;font-weight:700;color:#fbbf24;">资金流向</span></div>
      <div style="display:flex;gap:8px;align-items:center;">
        <select id="sortSelect" style="padding:3px 8px;border-radius:6px;border:1px solid #374151;background:#1f2937;color:#fff;font-size:12px;cursor:pointer;">
          <option value="fund">按资金</option>
          <option value="pct">按涨跌幅</option>
        </select>
        <button id="dateBtn" style="padding:3px 10px;border-radius:6px;border:1px solid #374151;background:transparent;color:#9ca3af;cursor:pointer;font-size:12px;">📅 日期</button>
      </div>
    </div>
    <div id="calendarModal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:1000;display:none;align-items:center;justify-content:center;">
      <div style="background:#1f2937;border-radius:12px;padding:20px;width:320px;max-width:90vw;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;">
          <button id="prevMonth" style="background:none;border:none;color:#fff;font-size:18px;cursor:pointer;padding:5px 10px;">‹</button>
          <span id="calendarTitle" style="color:#fff;font-size:15px;font-weight:bold;"></span>
          <button id="nextMonth" style="background:none;border:none;color:#fff;font-size:18px;cursor:pointer;padding:5px 10px;">›</button>
        </div>
        <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;">
          <div style="color:#6b7280;font-size:11px;padding:4px 0;">日</div>
          <div style="color:#6b7280;font-size:11px;padding:4px 0;">一</div>
          <div style="color:#6b7280;font-size:11px;padding:4px 0;">二</div>
          <div style="color:#6b7280;font-size:11px;padding:4px 0;">三</div>
          <div style="color:#6b7280;font-size:11px;padding:4px 0;">四</div>
          <div style="color:#6b7280;font-size:11px;padding:4px 0;">五</div>
          <div style="color:#6b7280;font-size:11px;padding:4px 0;">六</div>
        </div>
        <div id="calendarDays" style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;margin-top:5px;"></div>
      </div>
    </div>
    <div class="chart-wrapper">
      <canvas id="fundChart" style="width:100%;"></canvas>
      <div class="loading" id="loading">加载中...</div>
      <div class="empty-state" id="emptyState" style="display:none;">
        <div style="font-size:40px;margin-bottom:10px;">📊</div>
        <div>9:15开盘后开始显示数据</div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="/js/chart.js?v=40"></script>
</body>
</html>
