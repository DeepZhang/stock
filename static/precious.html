<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贵金属 · 黄金白银铜</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0e17; font-family: "PingFang SC","Microsoft YaHei",sans-serif; color: #e5e7eb; min-height: 100vh; }
  .navbar { background: #111827; border-bottom: 1px solid #1f2937; padding: 0 24px; display: flex; align-items: center; height: 56px; position: sticky; top: 0; z-index: 100; }
  .navbar .brand { font-size: 16px; font-weight: 700; color: #ff9f43; margin-right: 40px; }
  .navbar a { color: #9ca3af; text-decoration: none; padding: 8px 16px; border-radius: 6px; font-size: 14px; }
  .navbar a:hover { color: #fff; background: #1f2937; }
  .navbar a.active { color: #ff9f43; background: rgba(255,159,67,0.1); }
  .container { max-width: 1100px; margin: 0 auto; padding: 20px 16px; }

  /* 商品行情条 */
  .commodity-bar { background: #111827; border-radius: 12px; padding: 16px 20px; border: 1px solid #1f2937; margin-bottom: 16px; display: flex; gap: 40px; flex-wrap: wrap; }
  .comm-item { text-align: center; }
  .comm-name { font-size: 12px; color: #6b7280; margin-bottom: 4px; }
  .comm-price { font-size: 20px; font-weight: 700; }
  .comm-chg { font-size: 12px; margin-top: 2px; }
  .up { color: #ef4444; }
  .down { color: #22c55e; }

  /* 分组 */
  .group { background: #111827; border-radius: 12px; border: 1px solid #1f2937; margin-bottom: 16px; overflow: hidden; }
  .group-header { padding: 14px 20px; background: #1a2332; font-size: 15px; font-weight: 700; color: #ff9f43; }
  .stock-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1px; background: #1f2937; }
  .stock-card { background: #111827; padding: 14px 16px; cursor: pointer; transition: background 0.15s; }
  .stock-card:hover { background: #1a2332; }
  .stock-name { font-size: 14px; font-weight: 600; color: #fff; }
  .stock-code { font-size: 11px; color: #6b7280; margin-left: 6px; }
  .stock-price { font-size: 18px; font-weight: 700; margin-top: 6px; }
  .stock-chg { font-size: 12px; margin-top: 2px; }
  .stock-meta { font-size: 11px; color: #6b7280; margin-top: 6px; display: flex; gap: 12px; }
</style>
</head>
<body>
<nav class="navbar">
  <div class="brand">📊 股票看板</div>
  <button class="hamburger" onclick="document.getElementById('navMenu').classList.toggle('show')">☰</button>
  <div class="nav-links" id="navMenu">
    <a href="/">资金流向</a>
    <a href="/market">行情总览/每日复盘</a>
    <a href="/rank">排行榜</a>
    <a href="/kline">个股K线</a>
    <a href="/screener">选股器</a><a href="/sector-leaders">板块龙头</a>
        <a href="/shortterm">短线选股</a>
    <a href="/precious" class="active">贵金属</a>
  </div>
</nav>
<style>
.nav-links { display: none; position: absolute; top: 56px; left: 0; right: 0; background: #111827; flex-direction: column; padding: 8px 0; border-bottom: 1px solid #1f2937; }
.nav-links.show { display: flex; }
.nav-links a { padding: 12px 24px !important; }
.hamburger { margin-left: auto; background: none; border: none; color: #e5e7eb; font-size: 22px; cursor: pointer; padding: 8px 12px; }
@media(min-width:768px){
  .nav-links { display: flex !important; position: static; flex-direction: row; background: none; border: none; padding: 0; }
  .hamburger { display: none; }
}
</style>
<div class="container">
  <div class="commodity-bar" id="commBar">
    <div class="comm-item"><div class="comm-name" style="cursor:pointer;color:#ff9f43;" onclick="location.href='/kline?code=AU0&name=沪金连续'">沪金主力</div><div class="comm-price" id="c-au">--</div><div class="comm-chg" id="c-au-pct">--</div></div>
    <div class="comm-item"><div class="comm-name" style="cursor:pointer;color:#ff9f43;" onclick="location.href='/kline?code=AG0&name=沪银连续'">沪银主力</div><div class="comm-price" id="c-ag">--</div><div class="comm-chg" id="c-ag-pct">--</div></div>
    <div class="comm-item"><div class="comm-name" style="cursor:pointer;color:#ff9f43;" onclick="location.href='/kline?code=CU0&name=沪铜连续'">沪铜主力</div><div class="comm-price" id="c-cu">--</div><div class="comm-chg" id="c-cu-pct">--</div></div>
    <div class="comm-item"><div class="comm-name" style="cursor:pointer;color:#ff9f43;" onclick="location.href='/kline?code=GC00Y&name=COMEX黄金'">COMEX黄金</div><div class="comm-price" id="c-gc">--</div><div class="comm-chg" id="c-gc-pct">--</div></div>
    <div class="comm-item"><div class="comm-name" style="cursor:pointer;color:#ff9f43;" onclick="location.href='/kline?code=B00Y&name=布伦特原油'">布伦特原油</div><div class="comm-price" id="c-oil">--</div><div class="comm-chg" id="c-oil-pct">--</div></div>
    <div class="comm-item"><div class="comm-name" style="cursor:pointer;color:#ff9f43;" onclick="location.href='/kline?code=LC0&name=碳酸锂连续'">碳酸锂主力</div><div class="comm-price" id="c-lc">--</div><div class="comm-chg" id="c-lc-pct">--</div></div>
  </div>

  <div id="groups"></div>
</div>

<script>
const GROUPS = {
  "黄金": [
    ["sh600547","山东黄金"],["sh600489","中金黄金"],["sh600988","赤峰黄金"],
    ["sh600547","山东黄金"],["sz002155","湖南黄金"],["sh601899","紫金矿业"],
    ["sh600389","宏达股份"],["sz000975","银泰黄金"],["sh600711","盛屯矿业"],
  ],
  "白银": [
    ["sz000426","兴业银锡"],["sh601212","白银有色"],
  ],
  "铜": [
    ["sh600362","江西铜业"],["sz000878","云南铜业"],["sz000630","铜陵有色"],
    ["sh601168","西部矿业"],["sh603993","洛阳钼业"],["sz000737","北方铜业"],
  ],
  "稀土小金属": [
    ["sh600111","北方稀土"],["sz000831","中国稀土"],["sh600259","广晟有色"],
    ["sh603799","华友钴业"],["sz300618","寒锐钴业"],["sh603993","洛阳钼业"],
  ],
};

async function loadQuotes() {
  // 商品
  try {
    const r = await fetch("/api/commodities");
    const d = await r.json();
    const map = {"沪金":["c-au","c-au-pct"],"沪银":["c-ag","c-ag-pct"],"沪铜":["c-cu","c-cu-pct"],"COMEX黄金":["c-gc","c-gc-pct"],"布伦特原油":["c-oil","c-oil-pct"],"碳酸锂":["c-lc","c-lc-pct"]};
    for(const [name, [pid, cid]] of Object.entries(map)) {
      if(d[name]) {
        document.getElementById(pid).textContent = d[name].price;
        const el = document.getElementById(cid);
        el.textContent = (d[name].chg_pct>=0?"+":"") + d[name].chg_pct.toFixed(2) + "%";
        el.className = "comm-chg " + (d[name].chg_pct>=0?"up":"down");
      }
    }
  } catch(e) {}

  // 个股
  const allCodes = [];
  Object.values(GROUPS).forEach(arr => arr.forEach(([c]) => allCodes.push(c)));
  const unique = [...new Set(allCodes)];
  const quotes = {};
  // 分批请求
  for(let i=0; i<unique.length; i+=15) {
    const batch = unique.slice(i, i+15).join(",");
    try {
      const res = await fetch(`/api/quote_batch?codes=${batch}`);
      const data = await res.json();
      Object.assign(quotes, data);
    } catch(e) {}
  }

  // 渲染
  const html = Object.entries(GROUPS).map(([gname, stocks]) => {
    const items = [...new Map(stocks.map(s=>[s[0],s])).values()].map(([code, name]) => {
      const q = quotes[code] || {};
      const price = q.price ? q.price.toFixed(2) : "--";
      const chg = q.change_pct || 0;
      const cls = chg>=0 ? "up" : "down";
      return `<div class="stock-card" onclick="goKline('${code}','${name}')">
        <div><span class="stock-name">${name}</span><span class="stock-code">${code.slice(2)}</span></div>
        <div class="stock-price ${cls}">${price}</div>
        <div class="stock-chg ${cls}">${chg>=0?"+":""}${chg.toFixed(2)}%</div>
        <div class="stock-meta"><span>换手 ${q.turnover||0}%</span><span>市盈 ${q.pe||0}</span></div>
      </div>`;
    }).join("");
    return `<div class="group"><div class="group-header">${gname}（${new Set(stocks.map(s=>s[0])).size}只）</div><div class="stock-grid">${items}</div></div>`;
  }).join("");
  document.getElementById("groups").innerHTML = html;
}

function goKline(code, name) {
  window.location.href = `/kline?code=${encodeURIComponent(code)}&name=${encodeURIComponent(name)}`;
}

loadQuotes();
setInterval(loadQuotes, 5000);
</script>
</body>
</html>
