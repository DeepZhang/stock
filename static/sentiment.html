<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>市场交易情绪</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0e17;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #e5e7eb;
    min-height: 100vh;
  }
  .navbar {
    background: #111827;
    border-bottom: 1px solid #1f2937;
    padding: 0 24px;
    display: flex;
    align-items: center;
    height: 56px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .navbar .brand {
    font-size: 16px;
    font-weight: 700;
    color: #ff9f43;
    margin-right: 40px;
  }
  .navbar a {
    color: #9ca3af;
    text-decoration: none;
    padding: 8px 16px;
    border-radius: 6px;
    font-size: 14px;
    transition: all 0.2s;
  }
  .navbar a:hover { color: #fff; background: #1f2937; }
  .navbar a.active { color: #ff9f43; background: rgba(255,159,67,0.1); }

  .container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 24px 16px;
  }
  .page-title {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 20px;
    color: #fff;
  }
  .update-time {
    color: #6b7280;
    font-size: 13px;
    margin-bottom: 24px;
  }

  /* 情绪总览卡片 */
  .sentiment-hero {
    background: linear-gradient(135deg, #111827 0%, #1f2937 100%);
    border-radius: 16px;
    padding: 32px;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 40px;
    border: 1px solid #374151;
  }
  .gauge-wrap {
    position: relative;
    width: 180px;
    height: 180px;
    flex-shrink: 0;
  }
  .gauge-wrap svg {
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
  }
  .gauge-bg {
    fill: none;
    stroke: #1f2937;
    stroke-width: 12;
  }
  .gauge-fg {
    fill: none;
    stroke-width: 12;
    stroke-linecap: round;
    transition: stroke-dashoffset 1s ease, stroke 0.5s ease;
  }
  .gauge-center {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
  }
  .gauge-score {
    font-size: 42px;
    font-weight: 800;
    line-height: 1;
  }
  .gauge-label {
    font-size: 13px;
    color: #9ca3af;
    margin-top: 4px;
  }
  .hero-info {
    flex: 1;
  }
  .hero-level {
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .hero-desc {
    font-size: 14px;
    color: #9ca3af;
    line-height: 1.6;
  }
  .hero-tags {
    display: flex;
    gap: 8px;
    margin-top: 16px;
    flex-wrap: wrap;
  }
  .tag {
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
  }
  .tag-red { background: rgba(239,68,68,0.15); color: #ef4444; }
  .tag-green { background: rgba(34,197,94,0.15); color: #22c55e; }
  .tag-yellow { background: rgba(251,191,36,0.15); color: #fbbf24; }

  /* 指标网格 */
  .metrics-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }
  .metric-card {
    background: #111827;
    border-radius: 12px;
    padding: 20px;
    border: 1px solid #1f2937;
  }
  .metric-card .m-label {
    font-size: 13px;
    color: #9ca3af;
    margin-bottom: 8px;
  }
  .metric-card .m-value {
    font-size: 28px;
    font-weight: 700;
  }
  .metric-card .m-sub {
    font-size: 12px;
    color: #6b7280;
    margin-top: 6px;
  }
  .up { color: #ef4444; }
  .down { color: #22c55e; }

  /* 情绪构成 */
  .section-card {
    background: #111827;
    border-radius: 12px;
    padding: 24px;
    border: 1px solid #1f2937;
    margin-bottom: 24px;
  }
  .section-title {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 20px;
    color: #fff;
  }
  .factor-item {
    margin-bottom: 16px;
  }
  .factor-header {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    margin-bottom: 6px;
  }
  .factor-name { color: #9ca3af; }
  .factor-score { font-weight: 600; }
  .factor-bar {
    height: 8px;
    background: #1f2937;
    border-radius: 4px;
    overflow: hidden;
  }
  .factor-bar-fill {
    height: 100%;
    border-radius: 4px;
    transition: width 0.8s ease;
  }

  /* 结论 */
  .conclusion-box {
    background: #111827;
    border-radius: 12px;
    padding: 24px;
    border: 1px solid #1f2937;
    border-left: 4px solid #ff9f43;
  }
  .conclusion-title {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 12px;
    color: #ff9f43;
  }
  .conclusion-text {
    font-size: 14px;
    line-height: 1.8;
    color: #d1d5db;
  }
  .conclusion-text strong { color: #fff; }
</style>
</head>
<body>

<nav class="navbar">
  <div class="brand">📊 股票看板</div>
  <button class="hamburger" onclick="document.getElementById('navMenu').classList.toggle('show')">☰</button>
  <div class="nav-links" id="navMenu">
    <a href="/">资金流向</a>
    <a href="/market">行情总览/每日复盘</a>
    <a href="/rank">排行榜</a>
    <a href="/kline">个股K线</a>
    <a href="/screener">选股器</a><a href="/sector-leaders">板块龙头</a>
            <a href="/shortterm">短线选股</a>
    <a href="/precious">贵金属</a>
  </div>
</nav>
<style>
.nav-links { display: none; position: absolute; top: 56px; left: 0; right: 0; background: #111827; flex-direction: column; padding: 8px 0; border-bottom: 1px solid #1f2937; }
.nav-links.show { display: flex; }
.nav-links a { padding: 12px 24px !important; }
.hamburger { margin-left: auto; background: none; border: none; color: #e5e7eb; font-size: 22px; cursor: pointer; padding: 8px 12px; }
@media(min-width:768px){
  .nav-links { display: flex !important; position: static; flex-direction: row; background: none; border: none; padding: 0; }
  .hamburger { display: none; }
}
</style>

<div class="container">
  <div class="page-title">市场交易情绪</div>
  <div class="update-time" id="updateTime">加载中...</div>

  <!-- 情绪总览 -->
  <div class="sentiment-hero">
    <div class="gauge-wrap">
      <svg viewBox="0 0 180 180">
        <circle class="gauge-bg" cx="90" cy="90" r="75"></circle>
        <circle class="gauge-fg" id="gaugeFg" cx="90" cy="90" r="75"
          stroke-dasharray="471.2" stroke-dashoffset="471.2"></circle>
      </svg>
      <div class="gauge-center">
        <div class="gauge-score" id="gaugeScore">--</div>
        <div class="gauge-label">情绪指数</div>
      </div>
    </div>
    <div class="hero-info">
      <div class="hero-level" id="heroLevel">--</div>
      <div class="hero-desc" id="heroDesc">正在分析今日市场情绪...</div>
      <div class="hero-tags" id="heroTags"></div>
    </div>
  </div>

  <!-- 核心指标 -->
  <div class="metrics-grid">
    <div class="metric-card">
      <div class="m-label">涨停家数</div>
      <div class="m-value up" id="limitUpVal">-</div>
      <div class="m-sub" id="limitUpSub">涨幅 ≥ 9.9%</div>
    </div>
    <div class="metric-card">
      <div class="m-label">跌停家数</div>
      <div class="m-value down" id="limitDownVal">-</div>
      <div class="m-sub" id="limitDownSub">跌幅 ≤ -9.9%</div>
    </div>
    <div class="metric-card">
      <div class="m-label">涨跌停比</div>
      <div class="m-value" id="ldRatioVal">-</div>
      <div class="m-sub" id="ldRatioSub">涨停 ÷ 跌停</div>
    </div>
    <div class="metric-card">
      <div class="m-label">上涨家数占比</div>
      <div class="m-value" id="upRatioVal">-</div>
      <div class="m-sub" id="upRatioSub">上涨 ÷ 总家数</div>
    </div>
  </div>

  <!-- 情绪构成 -->
  <div class="section-card">
    <div class="section-title">情绪构成分析</div>
    <div id="factorList"></div>
  </div>

  <!-- 复盘结论 -->
  <div class="conclusion-box">
    <div class="conclusion-title">📋 今日复盘要点</div>
    <div class="conclusion-text" id="conclusionText">
      正在生成复盘结论...
    </div>
  </div>
</div>

<script src="/js/sentiment.js"></script>
</body>
</html>
